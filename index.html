<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For You 🥺❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================
           PAGE
        ===================================== */

        .page {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        /* =====================================
           IMAGE
        ===================================== */

        .background {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;

            animation: zoom 14s ease-in-out infinite alternate;
        }


        @keyframes zoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.035);
            }

        }


        /* =====================================
           IMAGE OVERLAY
        ===================================== */

        .overlay {

            position: absolute;

            inset: 0;

            z-index: 1;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.08),
                    rgba(0,0,0,0.25),
                    rgba(0,0,0,0.50)
                );
        }


        /* =====================================
           SOFT LIGHT
        ===================================== */

        .light {

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(255,220,230,0.12);

            filter: blur(70px);

            left: 50%;
            top: 5%;

            transform: translateX(-50%);

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================
           MAIN CONTENT
        ===================================== */

        .content {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 600px;

            text-align: center;

            z-index: 5;
        }


        /* =====================================
           CARD
        ===================================== */

        .card {

            padding: 30px 22px;

            border-radius: 28px;

            background:
                rgba(0,0,0,0.28);

            border:
                1px solid rgba(255,255,255,0.22);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.35);
        }


        /* =====================================
           HEART
        ===================================== */

        .heart {

            font-size: 32px;

            margin-bottom: 10px;

            animation: heartbeat 1.8s infinite;
        }


        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

        }


        /* =====================================
           QUESTION
        ===================================== */

        .question {

            color: white;

            font-size:
                clamp(30px, 7vw, 54px);

            font-weight: bold;

            line-height: 1.2;

            margin-bottom: 35px;

            text-shadow:
                0 3px 15px rgba(0,0,0,0.9);
        }


        /* =====================================
           BUTTON AREA

           IMPORTANT:
           This is ONLY for the initial
           position of the buttons.
        ===================================== */

        .buttons {

            position: relative;

            width: 250px;
            height: 55px;

            margin: 0 auto;
        }


        /* =====================================
           BUTTONS
        ===================================== */

        button {

            width: 105px;
            height: 52px;

            border: none;

            border-radius: 16px;

            font-size: 18px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            box-shadow:
                0 7px 20px rgba(0,0,0,0.35);

            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }


        /* =====================================
           YES

           NEVER MOVES
        ===================================== */

        #yes {

            position: absolute;

            left: 0;
            top: 0;

            background:
                linear-gradient(
                    135deg,
                    #55c878,
                    #29994f
                );

            z-index: 20;
        }


        /* =====================================
           NO

           IMPORTANT:
           It is FIXED from the beginning.

           Therefore it does NOT affect YES.
        ===================================== */

        #no {

            position: fixed;

            width: 105px;
            height: 52px;

            background:
                linear-gradient(
                    135deg,
                    #ff6666,
                    #d92f2f
                );

            z-index: 999999;

            margin: 0;

            padding: 0;

            transition:
                left 0.12s ease,
                top 0.12s ease;
        }


        /* =====================================
           SECOND PAGE
        ===================================== */

        #secondPage {

            display: none;
        }


        .message {

            color: white;

            font-size:
                clamp(24px, 5vw, 43px);

            font-weight: bold;

            line-height: 1.4;

            padding: 25px;

            border-radius: 25px;

            background:
                rgba(0,0,0,0.30);

            border:
                1px solid rgba(255,255,255,0.20);

            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

            text-shadow:
                0 3px 12px rgba(0,0,0,0.8);
        }


        /* =====================================
           FLOATING HEARTS
        ===================================== */

        .floating-heart {

            position: absolute;

            z-index: 3;

            color:
                rgba(255,255,255,0.75);

            font-size: 20px;

            pointer-events: none;

            animation:
                floatHeart 7s linear infinite;
        }


        .heart1 {

            left: 12%;
            bottom: -30px;

            animation-delay: 0s;
        }


        .heart2 {

            left: 78%;
            bottom: -30px;

            animation-delay: 2s;
        }


        .heart3 {

            left: 45%;
            bottom: -30px;

            animation-delay: 4s;
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.7;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(25deg);

                opacity: 0;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 500px) {

            .card {

                padding:
                    25px 15px;
            }

            .buttons {

                width: 235px;
            }

            button {

                width: 100px;

                height: 50px;

                font-size: 17px;
            }

            #no {

                width: 100px;

                height: 50px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         FIRST PAGE
    ===================================== -->

    <div
        class="page"
        id="firstPage"
    >


        <img
            class="background"
            src="IMG_5757.jpeg"
            alt="Our photo"
        >


        <div class="overlay"></div>


        <div class="light"></div>


        <!-- Floating hearts -->

        <div class="floating-heart heart1">
            ♡
        </div>

        <div class="floating-heart heart2">
            ♡
        </div>

        <div class="floating-heart heart3">
            ♡
        </div>


        <!-- Content -->

        <div class="content">

            <div class="card">


                <div class="heart">
                    🥺❤️
                </div>


                <div class="question">
                    U forgive me 🥺?
                </div>


                <!-- YES فقط داخل هذا العنصر -->

                <div class="buttons">

                    <button id="yes">
                        Yes ❤️
                    </button>

                </div>

            </div>

        </div>


        <!--
            NO مستقل تمامًا عن YES.
            لا يوجد داخل buttons.
        -->

        <button id="no">
            No
        </button>

    </div>



    <!-- =====================================
         SECOND PAGE
    ===================================== -->

    <div
        class="page"
        id="secondPage"
    >


        <img
            class="background"
            src="IMG_5756.jpeg"
            alt="Our photo"
        >


        <div class="overlay"></div>


        <div class="light"></div>


        <div class="content">

            <div
                class="message"
                id="finalMessage"
            >

                <!--
                    سأضع رسالتك هنا
                    عندما ترسلها لي
                -->

            </div>

        </div>

    </div>



    <script>


        /* =====================================
           GET ELEMENTS
        ===================================== */

        const noButton =
            document.getElementById("no");

        const yesButton =
            document.getElementById("yes");

        const firstPage =
            document.getElementById("firstPage");

        const secondPage =
            document.getElementById("secondPage");



        /* =====================================
           SET INITIAL NO POSITION
           
           This happens AFTER the page loads,
           so we know the actual screen size.
        ===================================== */

        function setInitialNoPosition() {

            const yesRect =
                yesButton.getBoundingClientRect();


            /*
             * Put No immediately beside Yes.
             */

            let x =
                yesRect.right + 20;

            let y =
                yesRect.top;


            /*
             * Make sure it fits.
             */

            const margin = 12;

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            const maxX =
                window.innerWidth -
                buttonWidth -
                margin;


            const maxY =
                window.innerHeight -
                buttonHeight -
                margin;


            x =
                Math.max(
                    margin,
                    Math.min(x, maxX)
                );


            y =
                Math.max(
                    margin,
                    Math.min(y, maxY)
                );


            noButton.style.left =
                x + "px";

            noButton.style.top =
                y + "px";
        }



        /* =====================================
           MOVE NO
        ===================================== */

        function moveNoButton() {

            const margin = 12;


            /*
             * Actual button dimensions.
             */

            const width =
                noButton.getBoundingClientRect().width;

            const height =
                noButton.getBoundingClientRect().height;


            /*
             * Current viewport.
             */

            const viewportWidth =
                window.innerWidth;

            const viewportHeight =
                window.innerHeight;


            /*
             * Maximum allowed coordinates.
             */

            const maxX =
                viewportWidth -
                width -
                margin;


            const maxY =
                viewportHeight -
                height -
                margin;


            /*
             * Generate random position.
             *
             * It can NEVER be negative.
             */

            let x =
                margin +
                Math.random() *
                Math.max(
                    0,
                    maxX - margin
                );


            let y =
                margin +
                Math.random() *
                Math.max(
                    0,
                    maxY - margin
                );


            /*
             * Final safety clamp.
             */

            x =
                Math.max(
                    margin,
                    Math.min(x, maxX)
                );


            y =
                Math.max(
                    margin,
                    Math.min(y, maxY)
                );


            /*
             * Move ONLY No.
             */

            noButton.style.left =
                x + "px";

            noButton.style.top =
                y + "px";
        }



        /* =====================================
           NO BUTTON

           pointerdown works for:
           - iPhone
           - Android
           - Mouse
        ===================================== */

        noButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                moveNoButton();

            }
        );



        /* =====================================
           YES BUTTON
        ===================================== */

        yesButton.addEventListener(
            "click",
            function() {

                firstPage.style.display =
                    "none";

                secondPage.style.display =
                    "block";

            }
        );



        /* =====================================
           INITIAL POSITION
        ===================================== */

        window.addEventListener(
            "load",
            function() {

                setInitialNoPosition();

            }
        );



        /* =====================================
           RESIZE / ROTATION
        ===================================== */

        window.addEventListener(
            "resize",
            function() {

                const margin = 12;

                const width =
                    noButton.getBoundingClientRect().width;

                const height =
                    noButton.getBoundingClientRect().height;


                const maxX =
                    window.innerWidth -
                    width -
                    margin;

                const maxY =
                    window.innerHeight -
                    height -
                    margin;


                let x =
                    parseFloat(
                        noButton.style.left
                    ) || margin;


                let y =
                    parseFloat(
                        noButton.style.top
                    ) || margin;


                x =
                    Math.max(
                        margin,
                        Math.min(x, maxX)
                    );


                y =
                    Math.max(
                        margin,
                        Math.min(y, maxY)
                    );


                noButton.style.left =
                    x + "px";

                noButton.style.top =
                    y + "px";

            }
        );

    </script>

</body>

</html>
