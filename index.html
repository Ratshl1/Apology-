<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🥺</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .background {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .content {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 600px;

            text-align: center;
            color: white;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .question {
            font-size: clamp(30px, 7vw, 55px);
            font-weight: bold;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 14px 35px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);

            transition: transform 0.15s ease;
        }

        #yes {
            background: #4caf50;
            color: white;
        }

        #no {
            background: #f44336;
            color: white;

            position: fixed;
            z-index: 10;
        }

        button:hover {
            transform: scale(1.08);
        }

        /* الصفحة الثانية */

        #secondPage {
            display: none;
        }

        .message {
            font-size: clamp(24px, 5vw, 42px);
            font-weight: bold;
            line-height: 1.4;

            background: rgba(0, 0, 0, 0.35);
            padding: 20px 25px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
        }
    </style>
</head>

<body>

    <!-- الصفحة الأولى -->
    <div class="page" id="firstPage">

        <!-- الصورة الأولى -->
        <img
            class="background"
            src="IMG_5757.jpeg"
            alt="Photo"
        >

        <div class="overlay"></div>

        <div class="content">

            <div class="question">
                U forgive me 🥺?
            </div>

            <div class="buttons">

                <button id="yes">
                    Yes
                </button>

                <button id="no">
                    No
                </button>

            </div>

        </div>
    </div>


    <!-- الصفحة الثانية -->
    <div class="page" id="secondPage">

        <!-- الصورة الثانية -->
        <img
            class="background"
            src="IMG_5756.jpeg"
            alt="Photo"
        >

        <div class="overlay"></div>

        <div class="content">

            <div class="message" id="finalMessage">
                <!-- سأضع الرسالة هنا لاحقًا -->
            </div>

        </div>

    </div>


    <script>

        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");

        const firstPage = document.getElementById("firstPage");
        const secondPage = document.getElementById("secondPage");


        // جعل زر No يهرب إلى مكان عشوائي
        function moveNoButton() {

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 10;
            const maxY = window.innerHeight - buttonHeight - 10;

            const randomX = Math.max(
                10,
                Math.random() * maxX
            );

            const randomY = Math.max(
                10,
                Math.random() * maxY
            );

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
        }


        // عند الضغط على No
        noButton.addEventListener("click", function () {
            moveNoButton();
        });


        // عند الضغط على Yes
        yesButton.addEventListener("click", function () {

            firstPage.style.display = "none";

            secondPage.style.display = "block";

        });


        // على الهاتف: إذا حاول لمس زر No
        noButton.addEventListener("touchstart", function () {
            moveNoButton();
        });


    </script>

</body>
</html>
