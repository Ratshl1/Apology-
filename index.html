<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 🥺❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================
           GENERAL PAGE
        ========================================= */

        .page {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }


        /* =========================================
           BACKGROUND IMAGE
        ========================================= */

        .background {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;

            animation: slowZoom 12s ease-in-out infinite alternate;
        }


        @keyframes slowZoom {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }

        }


        /* =========================================
           DARK / ROMANTIC OVERLAY
        ========================================= */

        .overlay {
            position: absolute;

            inset: 0;

            z-index: 1;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.12),
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.48)
                );
        }


        /* =========================================
           SOFT LIGHT
        ========================================= */

        .light {
            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(255, 210, 220, 0.12);

            filter: blur(70px);

            top: 10%;
            left: 50%;

            transform: translateX(-50%);

            z-index: 1;

            pointer-events: none;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .content {
            position: absolute;

            z-index: 5;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: min(90%, 600px);

            text-align: center;
        }


        /* =========================================
           GLASS CARD
        ========================================= */

        .card {
            padding: 30px 25px 28px;

            border-radius: 28px;

            background: rgba(0, 0, 0, 0.28);

            border: 1px solid rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.30);

            animation: cardAppear 1s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================================
           SMALL HEART
        ========================================= */

        .heart {
            font-size: 30px;

            margin-bottom: 12px;

            animation: heartbeat 1.8s infinite;
        }


        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }

        }


        /* =========================================
           QUESTION
        ========================================= */

        .question {
            color: white;

            font-size: clamp(30px, 7vw, 54px);

            font-weight: bold;

            line-height: 1.2;

            margin-bottom: 30px;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }


        /* =========================================
           BUTTON AREA
           
           IMPORTANT:
           This area has a fixed size.
           Therefore Yes will NEVER move.
        ========================================= */

        .buttons {
            position: relative;

            width: 260px;
            height: 58px;

            margin: 0 auto;
        }


        /* =========================================
           ALL BUTTONS
        ========================================= */

        button {
            position: absolute;

            top: 0;

            height: 52px;

            min-width: 105px;

            padding: 0 25px;

            border: none;

            border-radius: 16px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            color: white;

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }


        button:hover {
            transform: scale(1.07);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.45);
        }


        /* =========================================
           YES BUTTON
           
           It NEVER changes position.
        ========================================= */

        #yes {
            left: 0;

            background:
                linear-gradient(
                    135deg,
                    #55c878,
                    #2e9f55
                );
        }


        /* =========================================
           NO BUTTON
           
           Starts beside Yes.
           After clicking, becomes fixed to screen.
        ========================================= */

        #no {
            right: 0;

            background:
                linear-gradient(
                    135deg,
                    #ff6868,
                    #dc3030
                );
        }


        /* =========================================
           SECOND PAGE
        ========================================= */

        #secondPage {
            display: none;
        }


        .message {
            color: white;

            font-size: clamp(25px, 5vw, 43px);

            font-weight: bold;

            line-height: 1.4;

            padding: 25px;

            border-radius: 25px;

            background: rgba(0, 0, 0, 0.30);

            border: 1px solid rgba(255, 255, 255, 0.20);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.8);
        }


        /* =========================================
           FLOATING HEARTS
        ========================================= */

        .floating-heart {
            position: absolute;

            z-index: 3;

            color: rgba(255, 255, 255, 0.75);

            font-size: 18px;

            pointer-events: none;

            animation: floatHeart 6s linear infinite;
        }


        .heart1 {
            left: 12%;
            bottom: -30px;

            animation-delay: 0s;
        }


        .heart2 {
            left: 78%;
            bottom: -30px;

            animation-delay: 2s;
        }


        .heart3 {
            left: 45%;
            bottom: -30px;

            animation-delay: 4s;
        }


        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.7;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(25deg);

                opacity: 0;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .card {
                padding: 25px 18px;
            }

            .buttons {
                width: 245px;
            }

            button {
                min-width: 100px;

                padding: 0 20px;

                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         FIRST PAGE
    ========================================= -->

    <div
        class="page"
        id="firstPage"
    >


        <!-- First / older image -->

        <img
            class="background"
            src="IMG_5757.jpeg"
            alt="Our photo"
        >


        <!-- Dark overlay -->

        <div class="overlay"></div>


        <!-- Soft light -->

        <div class="light"></div>


        <!-- Floating hearts -->

        <div class="floating-heart heart1">
            ♡
        </div>

        <div class="floating-heart heart2">
            ♡
        </div>

        <div class="floating-heart heart3">
            ♡
        </div>


        <!-- Main content -->

        <div class="content">

            <div class="card">


                <!-- Heart -->

                <div class="heart">
                    🥺❤️
                </div>


                <!-- Question -->

                <div class="question">
                    U forgive me 🥺?
                </div>


                <!-- Buttons -->

                <div class="buttons">


                    <!-- YES -->

                    <button id="yes">
                        Yes ❤️
                    </button>


                    <!-- NO -->

                    <button id="no">
                        No
                    </button>


                </div>

            </div>

        </div>

    </div>



    <!-- =========================================
         SECOND PAGE
    ========================================= -->

    <div
        class="page"
        id="secondPage"
    >


        <!-- Second / newer image -->

        <img
            class="background"
            src="IMG_5756.jpeg"
            alt="Our photo"
        >


        <div class="overlay"></div>


        <div class="light"></div>


        <!-- Second page content -->

        <div class="content">

            <div class="message" id="finalMessage">

                <!--
                    SEND ME YOUR MESSAGE
                    AND I WILL PUT IT HERE
                -->

            </div>

        </div>

    </div>



    <script>


        /* =========================================
           ELEMENTS
        ========================================= */

        const noButton =
            document.getElementById("no");

        const yesButton =
            document.getElementById("yes");

        const firstPage =
            document.getElementById("firstPage");

        const secondPage =
            document.getElementById("secondPage");



        /* =========================================
           MOVE NO BUTTON
        ========================================= */

        function moveNoButton() {


            /*
             * From this point the No button
             * is completely independent from
             * the Yes button.
             */

            noButton.style.position = "fixed";


            /*
             * Remove the original right position.
             */

            noButton.style.right = "auto";


            /*
             * Make sure transform does not
             * move the button.
             */

            noButton.style.transform = "none";


            /*
             * Safe distance from screen edges.
             */

            const margin = 12;


            /*
             * Get actual button dimensions.
             */

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            /*
             * Available screen dimensions.
             */

            const screenWidth =
                document.documentElement.clientWidth;

            const screenHeight =
                document.documentElement.clientHeight;


            /*
             * Calculate the maximum allowed
             * X and Y coordinates.
             */

            const maxX =
                screenWidth -
                buttonWidth -
                margin;


            const maxY =
                screenHeight -
                buttonHeight -
                margin;


            /*
             * Generate a random position.
             */

            let randomX =
                margin +
                Math.random() *
                Math.max(0, maxX - margin);


            let randomY =
                margin +
                Math.random() *
                Math.max(0, maxY - margin);


            /*
             * FINAL SAFETY CHECK.
             *
             * This guarantees that the
             * entire button stays inside
             * the screen.
             */

            randomX =
                Math.max(
                    margin,
                    Math.min(
                        randomX,
                        maxX
                    )
                );


            randomY =
                Math.max(
                    margin,
                    Math.min(
                        randomY,
                        maxY
                    )
                );


            /*
             * Put the button there.
             */

            noButton.style.left =
                randomX + "px";

            noButton.style.top =
                randomY + "px";

        }



        /* =========================================
           NO BUTTON - MOUSE
        ========================================= */

        noButton.addEventListener(
            "click",
            function () {

                moveNoButton();

            }
        );



        /* =========================================
           NO BUTTON - PHONE TOUCH
        ========================================= */

        noButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNoButton();

            },
            {
                passive: false
            }
        );



        /* =========================================
           YES BUTTON
        ========================================= */

        yesButton.addEventListener(
            "click",
            function () {


                /*
                 * Hide first page.
                 */

                firstPage.style.display =
                    "none";


                /*
                 * Show second page.
                 */

                secondPage.style.display =
                    "block";

            }
        );



        /* =========================================
           KEEP NO INSIDE SCREEN AFTER ROTATION
        ========================================= */

        window.addEventListener(
            "resize",
            function () {


                /*
                 * Only do this after No
                 * has started moving.
                 */

                if (
                    noButton.style.position ===
                    "fixed"
                ) {


                    const margin = 12;


                    const buttonWidth =
                        noButton.offsetWidth;

                    const buttonHeight =
                        noButton.offsetHeight;


                    const screenWidth =
                        document.documentElement.clientWidth;

                    const screenHeight =
                        document.documentElement.clientHeight;


                    const maxX =
                        screenWidth -
                        buttonWidth -
                        margin;

                    const maxY =
                        screenHeight -
                        buttonHeight -
                        margin;


                    let x =
                        parseFloat(
                            noButton.style.left
                        ) || margin;


                    let y =
                        parseFloat(
                            noButton.style.top
                        ) || margin;


                    x =
                        Math.max(
                            margin,
                            Math.min(x, maxX)
                        );


                    y =
                        Math.max(
                            margin,
                            Math.min(y, maxY)
                        );


                    noButton.style.left =
                        x + "px";

                    noButton.style.top =
                        y + "px";

                }

            }
        );

    </script>


</body>

</html>
