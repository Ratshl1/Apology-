<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🥺</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* =========================
           الصفحة
        ========================= */

        .page {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: black;
        }


        /* =========================
           الصور
        ========================= */

        .background {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;
        }


        /* طبقة شفافة فوق الصورة */

        .overlay {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        /* =========================
           المحتوى
        ========================= */

        .content {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 600px;

            text-align: center;

            color: white;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.8);

            z-index: 2;
        }


        /* =========================
           السؤال
        ========================= */

        .question {
            font-size: clamp(30px, 7vw, 55px);

            font-weight: bold;

            margin-bottom: 35px;
        }


        /* =========================
           الأزرار
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }


        button {
            border: none;

            border-radius: 15px;

            padding: 14px 35px;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.15s ease;
        }


        button:hover {
            transform: scale(1.08);
        }


        /* زر Yes */

        #yes {
            background: #4caf50;

            color: white;
        }


        /* زر No */

        #no {
            background: #f44336;

            color: white;

            /*
            في البداية يكون بجانب Yes
            ولا نضع position هنا
            */
        }


        /* =========================
           الصفحة الثانية
        ========================= */

        #secondPage {
            display: none;
        }


        .message {
            font-size: clamp(24px, 5vw, 42px);

            font-weight: bold;

            line-height: 1.4;

            background: rgba(0, 0, 0, 0.35);

            padding: 20px 25px;

            border-radius: 20px;

            backdrop-filter: blur(3px);
        }


        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 500px) {

            .buttons {
                gap: 15px;
            }

            button {
                padding: 12px 28px;

                font-size: 18px;
            }
        }

    </style>
</head>


<body>


    <!-- ==================================
         الصفحة الأولى
    ================================== -->

    <div class="page" id="firstPage">

        <!-- الصورة الأولى -->

        <img
            class="background"
            src="IMG_5757.jpeg"
            alt="Photo"
        >

        <div class="overlay"></div>


        <div class="content">

            <div class="question">
                U forgive me 🥺?
            </div>


            <div class="buttons">

                <button id="yes">
                    Yes
                </button>


                <button id="no">
                    No
                </button>

            </div>

        </div>

    </div>



    <!-- ==================================
         الصفحة الثانية
    ================================== -->

    <div class="page" id="secondPage">

        <!-- الصورة الثانية -->

        <img
            class="background"
            src="IMG_5756.jpeg"
            alt="Photo"
        >

        <div class="overlay"></div>


        <div class="content">

            <div class="message" id="finalMessage">

                <!-- ضع الرسالة هنا لاحقًا -->

            </div>

        </div>

    </div>



    <script>


        /* =========================
           العناصر
        ========================= */

        const noButton =
            document.getElementById("no");

        const yesButton =
            document.getElementById("yes");

        const firstPage =
            document.getElementById("firstPage");

        const secondPage =
            document.getElementById("secondPage");



        /* =========================
           تحريك زر No
        ========================= */

        function moveNoButton() {

            /*
            نجعل الزر fixed بالنسبة
            إلى شاشة الهاتف/الكمبيوتر
            */

            noButton.style.position = "fixed";


            /*
            نزيل أي transform
            */

            noButton.style.transform = "none";


            /*
            المسافة الآمنة من أطراف الشاشة
            */

            const margin = 10;


            /*
            معرفة حجم الزر الحقيقي
            */

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            /*
            أقصى مكان مسموح للزر
            */

            const maxX =
                window.innerWidth -
                buttonWidth -
                margin;

            const maxY =
                window.innerHeight -
                buttonHeight -
                margin;


            /*
            اختيار مكان عشوائي
            */

            let randomX =
                margin +
                Math.random() * (maxX - margin);


            let randomY =
                margin +
                Math.random() * (maxY - margin);


            /*
            التأكد 100% من أن الزر
            لن يخرج خارج الشاشة
            */

            randomX =
                Math.max(
                    margin,
                    Math.min(randomX, maxX)
                );


            randomY =
                Math.max(
                    margin,
                    Math.min(randomY, maxY)
                );


            /*
            وضع الزر
            */

            noButton.style.left =
                randomX + "px";

            noButton.style.top =
                randomY + "px";
        }



        /* =========================
           عند الضغط على No
        ========================= */

        noButton.addEventListener(
            "click",
            function () {

                moveNoButton();

            }
        );



        /* =========================
           عند لمس No على الهاتف
        ========================= */

        noButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNoButton();

            },
            { passive: false }
        );



        /* =========================
           زر Yes
        ========================= */

        yesButton.addEventListener(
            "click",
            function () {

                /*
                إخفاء الصفحة الأولى
                */

                firstPage.style.display =
                    "none";


                /*
                إظهار الصفحة الثانية
                */

                secondPage.style.display =
                    "block";

            }
        );



        /* =========================
           عند تغيير حجم الشاشة
        ========================= */

        window.addEventListener(
            "resize",
            function () {

                /*
                إذا كان No قد هرب بالفعل،
                نتأكد أنه ما زال داخل الشاشة
                */

                if (
                    noButton.style.position ===
                    "fixed"
                ) {

                    const margin = 10;

                    const buttonWidth =
                        noButton.offsetWidth;

                    const buttonHeight =
                        noButton.offsetHeight;


                    const maxX =
                        window.innerWidth -
                        buttonWidth -
                        margin;

                    const maxY =
                        window.innerHeight -
                        buttonHeight -
                        margin;


                    let currentX =
                        parseFloat(
                            noButton.style.left
                        ) || margin;

                    let currentY =
                        parseFloat(
                            noButton.style.top
                        ) || margin;


                    currentX =
                        Math.max(
                            margin,
                            Math.min(currentX, maxX)
                        );


                    currentY =
                        Math.max(
                            margin,
                            Math.min(currentY, maxY)
                        );


                    noButton.style.left =
                        currentX + "px";

                    noButton.style.top =
                        currentY + "px";
                }

            }
        );

    </script>

</body>
</html>
